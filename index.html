<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="CONTEXTO - Gestión psicológica inteligente">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CONTEXTO">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" sizes="192x192" href="assets/icons/icon-192.svg">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.svg">
    <title>CONTEXTO | Gestión Psicológica</title>

    <link rel="stylesheet" href="css/themes/variables.css">
    <link rel="stylesheet" href="css/themes/dark.css">
    <link rel="stylesheet" href="css/themes/light.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/dashboard-new.css">
    <link rel="stylesheet" href="css/patients.css">
    <link rel="stylesheet" href="css/appointments.css">
    <link rel="stylesheet" href="css/auth-neural.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script type="importmap">
        {
            "imports": {
                "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
            }
        }
    </script>
    <style>
        #app-loader {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: #050810;
            transition: opacity 0.3s ease;
        }
        #app-loader.hidden { opacity: 0; pointer-events: none; }
        #app-loader .loader-ring {
            width: 40px; height: 40px; border-radius: 50%;
            border: 2px solid rgba(139,92,246,0.15);
            border-top-color: #8b5cf6;
            animation: app-spin 0.8s linear infinite;
        }
        @keyframes app-spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app-loader"><div class="loader-ring"></div></div>
    <div id="app">
        <div class="page-body" id="pageBody"></div>
    </div>

    <div id="modalContainer" class="modal-container" aria-hidden="true"></div>
    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>
    <div id="contextPanelContainer" class="context-panel-container" aria-hidden="true"></div>

    <script type="module" src="js/core/app.js"></script>
</body>
</html>
