<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo — Loading de Modal (Mente Serena)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #050810;
    --bg-card: rgba(20, 26, 46, 0.55);
    --bg-card-strong: rgba(22, 28, 50, 0.75);
    --bg-modal: rgba(12, 16, 30, 0.92);
    --violet: #8b5cf6;
    --violet-light: #c4b5fd;
    --violet-dim: rgba(139, 92, 246, 0.35);
    --blue: #38bdf8;
    --text-primary: #f1f2f8;
    --text-secondary: #9ba3bd;
    --text-tertiary: #6b7290;
    --border: rgba(255, 255, 255, 0.08);
    --border-violet: rgba(139, 92, 246, 0.4);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font-body);
    background:
      radial-gradient(ellipse 900px 600px at 50% 30%, rgba(139,92,246,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 15% 15%, rgba(56,189,248,0.08), transparent 60%),
      linear-gradient(180deg, #060812 0%, #090c18 45%, #0b0f1d 100%);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 40px 20px;
  }

  .page-title { font-family: var(--font-display); font-size: 22px; font-weight: 600; }
  .page-sub { color: var(--text-secondary); font-size: 13.5px; text-align: center; max-width: 420px; line-height: 1.5; }

  .demo-buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  .btn {
    padding: 11px 20px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border-violet);
    background: linear-gradient(135deg, rgba(139,92,246,0.9), rgba(124,58,237,0.9));
    color: #fff;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(139,92,246,0.35); }

  .btn.btn-ghost {
    background: rgba(255,255,255,0.03);
    color: var(--text-primary);
    border: 1px solid var(--border);
  }

  /* ---------------- Modal ---------------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(4, 6, 14, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }

  .modal-box {
    width: 100%;
    max-width: 460px;
    min-height: 300px;
    background: var(--bg-modal);
    border: 1px solid var(--border-violet);
    border-radius: 28px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.55), 0 0 60px rgba(139,92,246,0.12);
    padding: 26px;
    transform: translateY(24px) scale(0.97);
    opacity: 0;
    transition: transform 0.28s cubic-bezier(.2,.8,.2,1), opacity 0.28s ease;
    display: flex;
    flex-direction: column;
  }
  .modal-overlay.open .modal-box { transform: translateY(0) scale(1); opacity: 1; }

  .modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .modal-title { font-family: var(--font-display); font-size: 19px; font-weight: 600; margin: 0; }
  .modal-subtitle { font-size: 12.5px; color: var(--text-secondary); margin: 4px 0 0; }

  .modal-close {
    width: 32px; height: 32px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.03);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .modal-close svg { width: 14px; height: 14px; stroke: var(--text-secondary); }
  .modal-close:hover { border-color: var(--border-violet); background: rgba(139,92,246,0.12); }

  .modal-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* ---------------- Loading state ---------------- */
  .modal-loading {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 30px 10px 10px;
    animation: fade-in 0.3s ease;
  }

  .loading-orbit {
    position: relative;
    width: 64px;
    height: 64px;
  }

  .loading-orbit .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--violet);
    border-right-color: var(--blue);
    animation: spin 0.9s linear infinite;
  }

  .loading-orbit .ring.ring-2 {
    inset: 10px;
    border-top-color: transparent;
    border-right-color: transparent;
    border-bottom-color: var(--violet-light);
    border-left-color: rgba(56,189,248,0.6);
    animation: spin-rev 1.3s linear infinite;
    opacity: 0.7;
  }

  .loading-orbit .core {
    position: absolute;
    inset: 22px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.55), rgba(56,189,248,0.15));
    box-shadow: 0 0 18px rgba(139,92,246,0.6);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spin-rev { to { transform: rotate(-360deg); } }
  @keyframes pulse {
    0%, 100% { transform: scale(0.85); opacity: 0.7; }
    50% { transform: scale(1.05); opacity: 1; }
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  .loading-text { font-size: 13px; color: var(--text-secondary); text-align: center; }
  .loading-text strong { color: var(--text-primary); font-weight: 600; }

  .loading-dots span {
    display: inline-block;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--violet-light);
    margin: 0 2px;
    animation: dot-blink 1.2s ease-in-out infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dot-blink {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; }
  }

  /* Barra de progreso opcional */
  .loading-bar-track {
    width: 100%;
    max-width: 220px;
    height: 4px;
    border-radius: 20px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
  }
  .loading-bar-fill {
    height: 100%;
    width: 30%;
    border-radius: 20px;
    background: linear-gradient(90deg, var(--blue), var(--violet));
    animation: bar-sweep 1.1s ease-in-out infinite;
  }
  @keyframes bar-sweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(340%); }
  }

  /* Skeleton alternativo (para listas) */
  .skeleton-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; animation: fade-in 0.3s ease; }
  .skeleton-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }
  .skel-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 37%, rgba(255,255,255,0.05) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.6s ease-in-out infinite;
    flex-shrink: 0;
  }
  .skel-lines { flex: 1; display: flex; flex-direction: column; gap: 7px; }
  .skel-line {
    height: 9px;
    border-radius: 6px;
    background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 37%, rgba(255,255,255,0.05) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.6s ease-in-out infinite;
  }
  .skel-line.w60 { width: 60%; }
  .skel-line.w40 { width: 40%; }
  @keyframes shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }

  /* ---------------- Contenido real (tras cargar) ---------------- */
  .data-rows { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; animation: fade-in 0.3s ease; }
  .data-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }
  .eval-icon {
    width: 32px; height: 32px; border-radius: 10px;
    background: linear-gradient(150deg, rgba(139,92,246,0.25), rgba(56,189,248,0.14));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .eval-icon svg { width: 15px; height: 15px; stroke: var(--violet-light); }
  .data-main { flex: 1; min-width: 0; }
  .data-title { font-size: 13px; font-weight: 600; }
  .data-sub { font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }
  .btn-start {
    padding: 7px 13px;
    border-radius: 10px;
    border: 1px solid var(--border-violet);
    background: linear-gradient(135deg, rgba(139,92,246,0.9), rgba(124,58,237,0.9));
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  code {
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 12px;
  }
</style>
</head>
<body>

  <div class="page-title">Estado de carga para modales</div>
  <p class="page-sub">Demo aislada — mismo lenguaje visual de Mente Serena. Pruébalo con los dos estilos de carga: spinner orbital o skeleton.</p>

  <div class="demo-buttons">
    <button class="btn" id="btnSpinner">Abrir modal · Spinner orbital</button>
    <button class="btn btn-ghost" id="btnSkeleton">Abrir modal · Skeleton</button>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <h2 class="modal-title" id="modalTitle">Evaluaciones</h2>
          <p class="modal-subtitle" id="modalSubtitle">Cargando información del paciente…</p>
        </div>
        <button class="modal-close" id="modalCloseBtn" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

<script>
const overlay = document.getElementById('modalOverlay');
const body = document.getElementById('modalBody');
const subtitle = document.getElementById('modalSubtitle');

const SPINNER_HTML = `
  <div class="modal-loading">
    <div class="loading-orbit">
      <div class="ring"></div>
      <div class="ring ring-2"></div>
      <div class="core"></div>
    </div>
    <div class="loading-text">Cargando evaluaciones<span class="loading-dots"><span></span><span></span><span></span></span><br><strong>Mariana González</strong></div>
    <div class="loading-bar-track"><div class="loading-bar-fill"></div></div>
  </div>
`;

const SKELETON_HTML = `
  <div class="skeleton-list">
    ${Array.from({length: 3}).map(() => `
      <div class="skeleton-row">
        <div class="skel-avatar"></div>
        <div class="skel-lines">
          <div class="skel-line w60"></div>
          <div class="skel-line w40"></div>
        </div>
      </div>
    `).join('')}
  </div>
`;

const CONTENT_HTML = `
  <div class="data-rows">
    <div class="data-row">
      <div class="eval-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M7 3.5h7l4 4V19a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2Z"/></svg>
      </div>
      <div class="data-main">
        <div class="data-title">Inventario de Ansiedad de Beck (BAI)</div>
        <div class="data-sub">Mariana González · 14 Mayo 2025</div>
      </div>
      <button class="btn-start">Comenzar</button>
    </div>
    <div class="data-row">
      <div class="eval-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M7 3.5h7l4 4V19a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2Z"/></svg>
      </div>
      <div class="data-main">
        <div class="data-title">Escala de Depresión de Beck (BDI-II)</div>
        <div class="data-sub">Andrés Pérez · 14 Mayo 2025</div>
      </div>
      <button class="btn-start">Comenzar</button>
    </div>
    <div class="data-row">
      <div class="eval-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M7 3.5h7l4 4V19a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5.5a2 2 0 0 1 2-2Z"/></svg>
      </div>
      <div class="data-main">
        <div class="data-title">Cuestionario de Estrés Percibido (PSS)</div>
        <div class="data-sub">Luis Martínez · 15 Mayo 2025</div>
      </div>
      <button class="btn-start">Comenzar</button>
    </div>
  </div>
`;

function openModal(loadingType) {
  body.innerHTML = loadingType === 'spinner' ? SPINNER_HTML : SKELETON_HTML;
  subtitle.textContent = 'Cargando información del paciente…';
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  clearTimeout(openModal._t);
  openModal._t = setTimeout(() => {
    body.innerHTML = CONTENT_HTML;
    subtitle.textContent = 'Instrumentos psicológicos pendientes de aplicar.';
  }, 1600);
}

function closeModal() {
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('btnSpinner').addEventListener('click', () => openModal('spinner'));
document.getElementById('btnSkeleton').addEventListener('click', () => openModal('skeleton'));
document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
