<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada — CONTEXTO</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0a0a14">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a14'/%3E%3Cpath d='M16 7a9 9 0 100 18 9 9 0 000-18zm0 2.5a6.5 6.5 0 016.5 6.5 6.5 6.5 0 01-6.5 6.5 6.5 6.5 0 01-6.5-6.5A6.5 6.5 0 0116 9.5z' fill='%236366f1'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23818cf8'/%3E%3C/svg%3E">
    <style>
        /* Reset minimo, en linea a proposito: este archivo se sirve desde
           GitHub Pages tambien bajo un subpath (/Contexto/) y desde
           cualquier otro host estatico. Un <link href="/css/reset.css">
           se rompe en cuanto el proyecto no vive en la raiz del dominio. */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a14;
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0b8;
            --text-muted: #6b6b80;
            --border: #2a2a45;
            --accent: #6366f1;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .glow {
            position: absolute;
            width: 42rem;
            height: 42rem;
            border-radius: 9999px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.16), transparent 68%);
            pointer-events: none;
        }

        .err-wrap {
            position: relative;
            text-align: center;
            max-width: 32rem;
            width: 100%;
        }

        .err-code {
            font-size: clamp(4rem, 18vw, 8rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .err-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .err-text {
            color: var(--text-secondary);
            font-size: 0.9375rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .err-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 0.9375rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: transform 150ms ease, background 150ms ease, border-color 150ms ease;
            border: 1px solid transparent;
        }

        .btn:active { transform: translateY(1px); }

        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: #4f46e5; }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border-color: var(--border);
        }
        .btn-ghost:hover { color: var(--text-primary); border-color: var(--text-muted); }

        .err-brand {
            margin-top: 2.5rem;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        @media (prefers-reduced-motion: no-preference) {
            .err-wrap { animation: rise 500ms ease both; }
            @keyframes rise {
                from { opacity: 0; transform: translateY(12px); }
                to   { opacity: 1; transform: translateY(0); }
            }
        }
    </style>
</head>
<body>
    <div class="glow" aria-hidden="true"></div>

    <main class="err-wrap">
        <div class="err-code">404</div>
        <h1 class="err-title">No encontramos esta página</h1>
        <p class="err-text">
            El enlace que abriste no existe o fue movido.
            Si llegaste aquí desde el sistema, tu sesión sigue activa:
            vuelve al inicio y sigue trabajando donde lo dejaste.
        </p>

        <div class="err-actions">
            <a class="btn btn-primary" href="./" id="btnHome">Ir al inicio</a>
            <a class="btn btn-ghost" href="./#/dashboard">Ir a mi panel</a>
        </div>

        <p class="err-brand">CONTEXTO</p>
    </main>

    <script>
        // GitHub Pages sirve el 404 con la URL original en la barra de
        // direcciones, asi que un href="./" relativo resolveria a la ruta
        // inexistente y volveria a dar 404. Se resuelve contra el origen.
        document.getElementById('btnHome').href = window.location.origin + '/';
    </script>
</body>
</html>
